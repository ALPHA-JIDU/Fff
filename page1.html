<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Battle Royale Quiz - Level Test</title>
<style>
@font-face{font-family:'GFF Latin CdMedium';src:url('https://raw.githubusercontent.com/ALPHA-JIDU/GFF-font/main/GFF-Latin-CdMedium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
:root{--primary-dark:#222831;--secondary-dark:#393E46;--accent-bronze:#948979;--accent-cream:#DFD0B8;--pure-white:#fff;--glass-bg:rgba(255,255,255,0.08);--glass-border:rgba(255,255,255,0.15);--success:#00ff88;--error:#ff4757;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'GFF Latin CdMedium','Segoe UI',sans-serif;-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
body{background:var(--primary-dark);background-image:radial-gradient(at 0% 0%,hsla(30,10%,80%,0.1) 0px,transparent 50%),radial-gradient(at 100% 100%,hsla(30,10%,20%,0.4) 0px,transparent 50%);color:var(--pure-white);min-height:100vh;overflow:hidden;position:relative;}
.scanlines{position:fixed;inset:0;background:linear-gradient(rgba(57,62,70,0) 50%,rgba(34,40,49,0.2) 50%),linear-gradient(90deg,rgba(148,137,121,0.08),rgba(223,208,184,0.03),rgba(255,255,255,0.05));background-size:100% 4px,3px 100%;pointer-events:none;opacity:0.75;z-index:1;}
.glass{background:var(--glass-bg);backdrop-filter:blur(12px);border:1px solid var(--glass-border);}
.container{max-width:450px;margin:0 auto;padding:1rem;display:flex;flex-direction:column;height:100vh;position:relative;z-index:10;}
.preloader,.quiz-container,.popup{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;}
.preloader.active,.quiz-container.active,.popup.active{display:flex;}
.logo{width:clamp(200px,55vw,260px);filter:drop-shadow(0 0 20px rgba(223,208,184,0.3));margin-bottom:2rem;}
.spinner{width:4rem;height:4rem;border:4px solid var(--accent-bronze);border-top-color:var(--accent-cream);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:1.5rem;}
@keyframes spin{to{transform:rotate(360deg);}}
.pre-title{font-size:clamp(1.2rem,4vw,1.5rem);font-weight:900;background:linear-gradient(135deg,var(--accent-bronze),var(--accent-cream));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase;letter-spacing:.15em;margin-bottom:.5rem;text-align:center;}
.pre-text{color:var(--accent-cream);font-size:clamp(.9rem,2.5vw,1.1rem);text-align:center;letter-spacing:.08em;}
.quiz-header{display:flex;justify-content:space-between;align-items:center;width:100%;padding:1rem 0;margin-bottom:1.5rem;}
.timer{display:flex;align-items:center;gap:.5rem;background:var(--glass-bg);padding:1rem 1.5rem;border-radius:2rem;border:2px solid rgba(148,137,121,.3);font-weight:900;font-size:1.5rem;color:var(--accent-cream);}
.timer-circle{width:2.5rem;height:2.5rem;background:linear-gradient(135deg,var(--success),var(--accent-cream));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:900;}
.question{font-size:clamp(1.3rem,4vw,1.6rem);font-weight:900;text-align:center;background:linear-gradient(135deg,var(--accent-cream),var(--pure-white));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:2rem;letter-spacing:.05em;line-height:1.3;}
.options{display:flex;flex-direction:column;gap:1rem;width:100%;}
.option{padding:1.5rem 1.25rem;background:var(--glass-bg);border:2px solid rgba(148,137,121,.3);border-radius:1.5rem;cursor:pointer;transition:all .3s ease;font-size:clamp(1rem,3vw,1.2rem);font-weight:700;text-align:left;position:relative;overflow:hidden;}
.option:hover{background:rgba(223,208,184,.15);border-color:var(--accent-cream);transform:translateX(8px);}
.option.selected{background:linear-gradient(135deg,var(--success),#00cc6a);border-color:var(--success);color:var(--primary-dark)!important;}
.option.wrong{background:linear-gradient(135deg,var(--error),#ff2e4a);border-color:var(--error);color:var(--pure-white)!important;}
.option.correct{background:linear-gradient(135deg,var(--success),#00cc6a);border-color:var(--success);color:var(--pure-white)!important;}
.option.disabled{cursor:not-allowed;opacity:.6;}
.progress-bar{width:100%;height:8px;background:var(--secondary-dark);border-radius:4px;overflow:hidden;margin-top:1rem;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-bronze),var(--accent-cream));border-radius:4px;transition:width .3s ease;width:10%;}
.btn{width:100%;max-width:350px;height:70px;background:var(--accent-cream);border:2px solid var(--accent-bronze);border-radius:30px;font-size:1.8rem;font-weight:900;color:var(--primary-dark);cursor:pointer;display:flex;align-items:center;justify-content:center;text-transform:uppercase;letter-spacing:.15em;transition:all .3s ease;margin-top:2rem;}
.btn:hover{background:var(--pure-white);transform:translateY(-2px);box-shadow:var(--accent-bronze) 6px 6px 0 0;}
.popup-title{font-size:clamp(1.5rem,5vw,2rem);font-weight:900;margin-bottom:1rem;text-align:center;}
.score-display{font-size:clamp(2.5rem,8vw,4rem);font-weight:900;margin:1rem 0;color:var(--success);}
.percentage{font-size:1.5rem;color:var(--accent-cream);margin-bottom:2rem;}
.error-popup .popup-title{color:var(--error)!important;}
@media (max-width:480px){.container{padding:.5rem;}}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="container">
<!-- PRELOADER -->
<div class="preloader active" id="preloader">
<img src="https://i.ibb.co.com/ccVzVVQC/20260502-142554.png" alt="Logo" class="logo">
<div class="spinner"></div>
<h3 class="pre-title">Verifying Access Token</h3>
<p class="pre-text" id="pre-text">Authenticating secure session...</p>
</div>

<!-- QUIZ -->
<div class="quiz-container" id="quizContainer">
<div class="quiz-header">
<div class="timer">
<span class="timer-circle" id="timerCircle">60</span>
<span id="timerText">60s</span>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>
</div>

<!-- SUCCESS POPUP -->
<div class="popup" id="successPopup">
<h3 class="popup-title">🎉 Congratulations Elite Player!</h3>
<div class="score-display" id="finalScore">8/10</div>
<div class="percentage" id="finalPercentage">80%</div>
<p style="text-align:center;color:var(--accent-cream);font-size:1.1rem;margin-bottom:2rem;">You beat 95% of players!</p>
<button class="btn" onclick="restartQuiz()">Play Again</button>
<button class="btn" style="background:var(--error);border-color:var(--error);margin-top:1rem;color:white;" onclick="window.location.href='index.html'">Exit</button>
</div>

<!-- ERROR POPUP -->
<div class="popup error-popup" id="errorPopup">
<h3 class="popup-title">❌ Access Denied</h3>
<p style="text-align:center;color:var(--accent-cream);font-size:1.1rem;margin:1rem 0 2rem;">Invalid or expired token. Hacking detected.</p>
<button class="btn" style="background:var(--error);border-color:var(--error);color:white;" onclick="window.location.href='index.html'">Back to Home</button>
</div>

<!-- TIMEOUT POPUP -->
<div class="popup" id="timeoutPopup">
<h3 class="popup-title">⏰ Time's Up!</h3>
<p style="text-align:center;color:var(--accent-cream);font-size:1.1rem;margin:1rem 0 2rem;">Quiz timeout. Try again?</p>
<button class="btn" onclick="restartQuiz()">Restart Quiz</button>
<button class="btn" style="background:var(--error);border-color:var(--error);margin-top:1rem;color:white;" onclick="window.location.href='index.html'">Exit</button>
</div>
</div>

<script>
const questions=[{q:"Which character has the highest HP in Free Fire?",o:["Alok","K","Chrono","Skyler"],a:1},{q:"What is the max squad size?",o:["3","4","5","6"],a:1},{q:"Best weapon for close range?",o:["M4A1","MP40","SCAR","AWM"],a:1},{q:"What does Gloo Wall do?",o:["Heal","Shield","Damage","Speed"],a:1},{q:"Which skill revives teammates?",o:["Alok","K","Clu","Hayato"],a:1},{q:"What is the drop height damage?",o:["10%","20%","30%","40%"],a:1},{q:"Fastest vehicle?",o:["Monster Truck","Sports Car","Motorcycle","Jet Ski"],a:1},{q:"What gives shield in Clash Squad?",o:["Armor Plate","Medkit","Gloo Wall","Vest"],a:1},{q:"Character with wall penetration?",o:["Xayne","Laura","Luqueta","Wukong"],a:0},{q:"Max grenades per slot?",o:["2","3","4","5"],a:1},{q:"What heals over time?",o:["Medkit","First Aid","Painkiller","Bandage"],a:2},{q:"Best sniper scope?",o:["2x","4x","8x","Red Dot"],a:1},{q:"What reduces recoil?",o:["Foregrip","Muzzle","Stock","Magazine"],a:0},{q:"Character with drone?",o:["Wukong","Clu","K","Alok"],a:1},{q:"Zone damage per tick?",o:["2 HP","5 HP","10 HP","15 HP"],a:1},{q:"What is headshot multiplier?",o:["2x","2.5x","3x","4x"],a:0},{q:"Fastest healing item?",o:["Medkit","First Aid","Bandage","Painkiller"],a:1},{q:"What blocks bullets?",o:["Gloo Wall","Vest","Helmet","Shield"],a:0},{q:"Max ammo for AR?",o:["200","300","400","500"],a:1},{q:"Character speed boost?",o:["Kelly","Hayato","Alok","Chrono"],a:0}];
let currentQuestions=[],currentQ=0,score=0,timeLeft=60,selectedAnswer=-1,timerInterval,token,level;
function init(){token=sessionStorage.getItem('elite_quiz_token');level=sessionStorage.getItem('quiz_level')||'easy';if(!token){showError();return;}setTimeout(verifyToken,500);}
function verifyToken(){setTimeout(()=>{showQuiz();},2000);}
function showError(){document.getElementById('preloader').classList.remove('active');document.getElementById('errorPopup').classList.add('active');}
function showQuiz(){document.getElementById('preloader').classList.remove('active');document.getElementById('quizContainer').classList.add('active');shuffleQuestions();startTimer();}
function shuffleQuestions(){currentQuestions=questions.sort(()=>Math.random()-0.5).slice(0,10);loadQuestion();}
function loadQuestion(){if(currentQ>=10){endQuiz();return;}const q=currentQuestions[currentQ];document.getElementById('question').textContent=q.q;const options=document.getElementById('options');options.innerHTML='';q.o.forEach((opt,i)=>{const div=document.createElement('div');div.className='option';div.textContent=String.fromCharCode(65+i)+'. '+opt;div.onclick=()=>selectAnswer(i);options.appendChild(div);});document.querySelectorAll('.option').forEach(el=>el.classList.add('disabled'));selectedAnswer=-1;updateProgress();}
function selectAnswer(index){if(selectedAnswer!==-1)return;selectedAnswer=index;setTimeout(()=>{const correct=currentQuestions[currentQ].a;if(index===correct){score++;}else{document.querySelectorAll('.option')[correct].classList.add('correct');}document.querySelectorAll('.option')[index].classList.add(index===correct?'correct':'wrong');setTimeout(()=>{currentQ++;loadQuestion();},1500);},300);}
function updateProgress(){const progress=(currentQ/10)*100;document.getElementById('progressFill').style.width=progress+'%';}
function startTimer(){timeLeft=60;timerInterval=setInterval(()=>{timeLeft--;document.getElementById('timerCircle').textContent=timeLeft;document.getElementById('timerText').textContent=timeLeft+'s';if(timeLeft<=10){document.getElementById('timerCircle').style.background='linear-gradient(135deg,var(--error),#ff4757)';}if(timeLeft<=0){clearInterval(timerInterval);showTimeout();}},1000);}
function endQuiz(){clearInterval(timerInterval);const percentage=Math.round((score/10)*100);document.getElementById('finalScore').textContent=`${score}/10`;document.getElementById('finalPercentage').textContent=`${percentage}%`;document.getElementById('quizContainer').classList.remove('active');document.getElementById('successPopup').classList.add('active');}
function showTimeout(){clearInterval(timerInterval);document.getElementById('quizContainer').classList.remove('active');document.getElementById('timeoutPopup').classList.add('active');}
function restartQuiz(){currentQ=0;score=0;document.getElementById('successPopup').classList.remove('active');document.getElementById('timeoutPopup').classList.remove('active');document.getElementById('quizContainer').classList.add('active');shuffleQuestions();startTimer();}
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{if(e.key==='F12'||e.ctrlKey&&e.key==='u')e.preventDefault();},false);init();
</script>
</body>
</html>
