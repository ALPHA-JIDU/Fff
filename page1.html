<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Battle Royale Quiz - Level Test</title>
  <style>
@font-face{
    font-family:'GFF Latin CdMedium';
    src:url('fonts/GFF-Latin-CdMedium.woff2') format('woff2');
    font-display:swap;
}

:root{
    --primary-dark:#222831;
    --secondary-dark:#393E46;
    --accent-bronze:#948979;
    --accent-cream:#DFD0B8;
    --pure-white:#fff;
    --glass-bg:rgba(255,255,255,.08);
    --glass-border:rgba(255,255,255,.15);
    --success:#00ff88;
    --error:#ff4757;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'GFF Latin CdMedium','Segoe UI',sans-serif;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html{
    height:100%;
}

body{
    background:var(--primary-dark);
    background-image:
    radial-gradient(at 0% 0%,hsla(30,10%,80%,0.1) 0px,transparent 50%),
    radial-gradient(at 100% 100%,hsla(30,10%,20%,0.4) 0px,transparent 50%);
    color:var(--pure-white);
    height:100%;
    overflow:hidden;
}

.scanlines{
    position:fixed;
    inset:0;
    background:
    linear-gradient(rgba(57,62,70,0) 50%,rgba(34,40,49,.2) 50%),
    linear-gradient(90deg,rgba(148,137,121,.08),rgba(223,208,184,.03),rgba(255,255,255,.05));
    background-size:100% 4px,3px 100%;
    pointer-events:none;
    opacity:.75;
}

.container{
    max-width:450px;
    margin:auto;
    padding:1rem;
    display:flex;
    flex-direction:column;
    height:100%;
    position:relative;
    z-index:2;
}

.preloader,
.quiz-container,
.popup,
.ad-popup{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100%;
}

.active{
    display:flex;
}

.logo{
    width:clamp(200px,55vw,260px);
    margin-bottom:2rem;
}

.spinner{
    width:4rem;
    height:4rem;
    border:4px solid var(--accent-bronze);
    border-top-color:var(--accent-cream);
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-bottom:1.5rem;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.pre-title{
    font-size:1.4rem;
    font-weight:900;
    color:var(--accent-cream);
    margin-bottom:.5rem;
    text-align:center;
}

.pre-text{
    color:var(--accent-cream);
    text-align:center;
}

.quiz-wrapper{
    width:100%;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.quiz-header{
    width:100%;
    max-width:400px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1rem;
    margin-bottom:2rem;
}

.timer-circle{
    width:3.2rem;
    height:3.2rem;
    background:var(--secondary-dark);
    border:3px solid rgba(148,137,121,.5);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    color:var(--accent-cream);
}

.progress-bar{
    width:100%;
    height:10px;
    background:var(--secondary-dark);
    border-radius:5px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent-bronze),var(--accent-cream));
    transition:width .3s;
}

.question{
    font-size:1.5rem;
    font-weight:900;
    text-align:center;
    margin:2rem 0;
    line-height:1.3;
}

.options{
    width:100%;
    max-width:400px;
    display:flex;
    flex-direction:column;
    gap:1rem;
}

.option{
    padding:1.2rem;
    background:var(--glass-bg);
    border:2px solid rgba(148,137,121,.3);
    border-radius:1.2rem;
    cursor:pointer;
    transition:.3s;
    font-weight:700;
}

.option:hover{
    background:rgba(223,208,184,.12);
}

.option.correct{
    background:rgba(0,255,136,.15);
    border-color:rgba(0,255,136,.7);
}

.option.wrong{
    background:rgba(255,71,87,.15);
    border-color:rgba(255,71,87,.7);
}

.option.disabled{
    pointer-events:none;
}

.next-btn-container{
    width:100%;
    max-width:400px;
    margin-top:1.5rem;
    text-align:center;
}

.next-btn{
    width:120px;
    height:50px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-size:1.1rem;
    font-weight:900;
    background:linear-gradient(135deg,var(--accent-cream),var(--accent-bronze));
    color:var(--primary-dark);
}

.error-text{
    color:var(--error);
    margin-top:.5rem;
    opacity:0;
    transition:.3s;
    font-size:.9rem;
    font-weight:700;
}

.error-text.show{
    opacity:1;
}

.banner-ad{width:100%;max-width:320px;height:50px;margin:2rem auto;background:var(--secondary-dark);border:1px solid rgba(148,137,121,.4);border-radius:.5rem;overflow:hidden;display:flex;align-items:center;justify-content:center;}

.popup-title{
    font-size:2rem;
    font-weight:900;
    text-align:center;
    margin-bottom:1rem;
}

.score-display{
    font-size:4rem;
    font-weight:900;
    color:var(--success);
}

.rank-badge{
    margin:1rem 0;
    padding:1rem 2rem;
    border-radius:2rem;
    border:3px solid;
    font-weight:900;
    letter-spacing:.1em;
}

.rank-rookie{color:#ff9500;}
.rank-veteran{color:#ffd700;}
.rank-elite{color:#00ff88;}
.rank-legendary{color:#ff00ff;}

.btn{
    width:100%;
    max-width:350px;
    height:65px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-size:1.2rem;
    font-weight:900;
    margin-top:1rem;
    background:var(--accent-cream);
    color:var(--primary-dark);
}

.exit-btn{
    background:var(--error);
    color:#fff;
}

.ad-popup-container {
    width:100%;
    max-width:350px;
    padding:1rem;
    border-radius:1rem;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    display:flex;
    flex-direction:column;
    align-items:center;
}

.ad-container {
    width:100%;
    max-width:300px;
    height:250px;
    margin:1rem auto;
    background:var(--secondary-dark);
    border-radius:1rem;
    border:1px solid rgba(148,137,121,.3);
    display:flex !important;
    align-items:center !important;
    justify-content:center !important;
    overflow: hidden;
}

.motivate-text{
    text-align:center;
    color:var(--accent-cream);
    line-height:1.5;
    margin:1rem 0;
}
</style>
  <style>body { box-sizing: border-box; }</style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
 </head>
 <body>
  <div class="scanlines"></div>
  <div class="container"><!-- PRELOADER -->
   <div class="preloader active" id="preloader"><img src="logo/logo.webp" class="logo" alt="Logo">
    <div class="spinner"></div>
    <h3 class="pre-title">Verifying Access Token</h3>
    <p class="pre-text">Authenticating secure session...</p>
   </div><!-- QUIZ -->
   <div class="quiz-container" id="quizContainer">
    <div class="quiz-wrapper">
     <div class="quiz-header">
      <div class="timer-circle"><span id="timerNumber">60s</span>
      </div>
      <div class="progress-bar">
       <div class="progress-fill" id="progressFill"></div>
      </div>
     </div>
     <div class="question" id="question"></div>
     <div class="options" id="options"></div>
     <div class="next-btn-container"><button class="next-btn" id="nextBtn">NEXT</button>
      <div class="error-text" id="errorText">
       SELECT ANSWER FIRST
      </div>
     </div>
     <div class="banner-ad">
      <script>
atOptions={
'key':'cf98935e71b827c45c756e4614c046fe',
'format':'iframe',
'height':50,
'width':320,
'params':{}
};
</script>
      <script src="https://www.highperformanceformat.com/cf98935e71b827c45c756e4614c046fe/invoke.js"></script>
     </div>
    </div>
   </div><!-- SUCCESS -->
   <div class="popup" id="successPopup">
    <h3 class="popup-title">🎉 Congratulations Elite Player!</h3>
    <div class="rank-badge" id="rankBadge"></div>
    <div class="score-display" id="finalScore">
     0/10
    </div>
    <p style="margin:1rem 0;text-align:center;">You beat <span id="beatPercentage" style="color:var(--success);font-weight:900;">95%</span> of players!</p><button class="btn" onclick="showRestartAd()">Play Again</button> <button class="btn exit-btn" onclick="window.location.href='index.html'"> Exit </button>
   </div><!-- RESTART AD POPUP - CSS CENTERED -->
   <div class="ad-popup" id="restartAdPopup">
    <div class="ad-popup-container">
     <div class="ad-container">
      <script>atOptions={'key':'f688f773ce3492cbfd5831e1b1c6222c','format':'iframe','height':250,'width':300,'params':{}};</script>
      <script src="https://www.highperformanceformat.com/f688f773ce3492cbfd5831e1b1c6222c/invoke.js"></script>
     </div>
     <div style="display:flex;gap:1rem;width:100%;margin-top:2rem;flex-wrap:wrap;"><button class="btn" style="height:60px;font-size:1.4rem;flex:1;margin-top:1rem;" onclick="restartQuizFromAd()">CONTINUE</button> <button class="btn" style="background:var(--error);border-color:var(--error);height:60px;font-size:1.4rem;flex:1;color:white;margin-top:1rem;" onclick="window.location.href='index.html'">HOME</button>
     </div>
    </div>
   </div><!-- ERROR -->
   <div class="popup" id="errorPopup">
    <h3 class="popup-title" style="color:var(--error);">❌ Access Denied</h3>
    <p style="text-align:center;margin-bottom:2rem;">Unauthorized Url.</p><button class="btn exit-btn" onclick="window.location.href='index.html'"> Back to Home </button>
   </div><!-- TIMEOUT -->
   <div class="popup" id="timeoutPopup">
    <h3 class="popup-title">⚡ Almost Won!</h3>
    <p class="motivate-text">You're just one step away from glory!</p><button class="btn" onclick="showRestartAd()">Retry Now</button> <button class="btn exit-btn" onclick="window.location.href='index.html'"> Exit </button>
   </div>
  </div>
  <script>
const questions = [
{q:"Which character has the highest HP in Free Fire?",o:["Alok","K","Chrono","Skyler"],a:1},
{q:"What is the max squad size?",o:["3","4","5","6"],a:1},
{q:"Best weapon for close range?",o:["M4A1","MP40","SCAR","AWM"],a:1},
{q:"What does Gloo Wall do?",o:["Heal","Shield","Damage","Speed"],a:1},
{q:"Which skill revives teammates?",o:["Alok","K","Clu","Hayato"],a:1},
{q:"Fastest vehicle?",o:["Monster Truck","Sports Car","Motorcycle","Jet Ski"],a:1},
{q:"Character with wall penetration?",o:["Xayne","Laura","Luqueta","Wukong"],a:0},
{q:"Max grenades per slot?",o:["2","3","4","5"],a:1},
{q:"What heals over time?",o:["Medkit","First Aid","Painkiller","Bandage"],a:2},
{q:"What blocks bullets?",o:["Gloo Wall","Vest","Helmet","Shield"],a:0}
];

let currentQuestions = [];
let currentQ = 0;
let score = 0;
let timeLeft = 60;
let selectedAnswer = -1;
let timerInterval;

const question = document.getElementById('question');
const options = document.getElementById('options');
const progressFill = document.getElementById('progressFill');
const timerNumber = document.getElementById('timerNumber');
const nextBtn = document.getElementById('nextBtn');
const errorText = document.getElementById('errorText');

function getRank(score){
    if(score >= 9) return {name:'LEGENDARY', class:'rank-legendary'};
    if(score >= 7) return {name:'ELITE', class:'rank-elite'};
    if(score >= 4) return {name:'VETERAN', class:'rank-veteran'};
    return {name:'ROOKIE', class:'rank-rookie'};
}

function getBeat(score){
    if(score >= 9) return 93;
    if(score >= 6) return 75;
    if(score >= 4) return 55;
    return 30;
}

function init(){

    const token = sessionStorage.getItem('elite_quiz_token');
    const expiry = parseInt(sessionStorage.getItem('token_expiry'));

    if(!token || !expiry || Date.now() > expiry){
        showError();
        return;
    }

    nextBtn.onclick = nextQuestion;

    setTimeout(showQuiz,2000);
}

function showError(){
    preloader.classList.remove('active');
    errorPopup.classList.add('active');
}

function showQuiz(){
    preloader.classList.remove('active');
    quizContainer.classList.add('active');

    currentQuestions = [...questions]
    .sort(()=>Math.random()-0.5)
    .slice(0,10);

    loadQuestion();
    startTimer();
}

function loadQuestion(){

    if(currentQ >= 10){
        endQuiz();
        return;
    }

    selectedAnswer = -1;

    const q = currentQuestions[currentQ];

    question.textContent = q.q;

    options.innerHTML = '';

    q.o.forEach((opt,i)=>{

        const div = document.createElement('div');

        div.className = 'option';
        div.textContent = `${String.fromCharCode(65+i)}. ${opt}`;

        div.onclick = ()=>selectAnswer(i);

        options.appendChild(div);
    });

    progressFill.style.width = `${currentQ*10}%`;

    errorText.classList.remove('show');
}

function selectAnswer(index){

    if(selectedAnswer !== -1) return;

    selectedAnswer = index;

    const optionEls = document.querySelectorAll('.option');
    const correct = currentQuestions[currentQ].a;

    optionEls.forEach(el=>el.classList.add('disabled'));

    if(index === correct){
        optionEls[index].classList.add('correct');
        score++;
    }else{
        optionEls[index].classList.add('wrong');
        optionEls[correct].classList.add('correct');
    }
}

function nextQuestion(){

    if(selectedAnswer === -1){

        errorText.classList.add('show');

        setTimeout(()=>{
            errorText.classList.remove('show');
        },1500);

        return;
    }

    currentQ++;
    loadQuestion();
}

function startTimer(){

    clearInterval(timerInterval);

    timeLeft = 60;

    timerNumber.textContent = '60s';

    timerInterval = setInterval(()=>{

        timeLeft--;

        timerNumber.textContent = `${timeLeft}s`;

        if(timeLeft <= 0){
            clearInterval(timerInterval);
            showTimeout();
        }

    },1000);
}

function endQuiz(){

    clearInterval(timerInterval);

    finalScore.textContent = `${score}/10`;

    const rank = getRank(score);

    rankBadge.textContent = rank.name;
    rankBadge.className = `rank-badge ${rank.class}`;

    beatPercentage.textContent = `${getBeat(score)}%`;

    quizContainer.classList.remove('active');

    successPopup.classList.add('active');
}

function showTimeout(){

    clearInterval(timerInterval);

    quizContainer.classList.remove('active');

    timeoutPopup.classList.add('active');
}

function showRestartAd(){

    successPopup.classList.remove('active');
    timeoutPopup.classList.remove('active');

    restartAdPopup.classList.add('active');
}

function restartQuizFromAd(){

    restartAdPopup.classList.remove('active');

    currentQ = 0;
    score = 0;

    quizContainer.classList.add('active');

    currentQuestions = [...questions]
    .sort(()=>Math.random()-0.5)
    .slice(0,10);

    loadQuestion();

    startTimer();
}

document.addEventListener('contextmenu',e=>e.preventDefault());

document.addEventListener('keydown',e=>{
    if(e.key==='F12'||(e.ctrlKey&&e.key==='u')){
        e.preventDefault();
    }
});

init();
</script>
 </body>
</html>
